name: CI

# Runs the checks CONTRIBUTING.md calls mandatory, on every pull request.
#
# WHY THIS EXISTS: until this workflow, `release.yml` was the only one in the repo, and it fires
# only on a version tag or a manual dispatch. Nothing ran on a pull request at all — every PR
# merged today had an empty status-check list. So "Android lint is not optional" was enforced
# entirely by contributors remembering to run it, on a project whose own contributing guide
# explains that lint catches `NewApi` mistakes that compile cleanly, pass every test, and then
# throw `NoSuchMethodError` on a console with no physical Home button.
#
# Two failures on one day made the case:
#
#   - CONTRIBUTING.md's test block could not be pasted. All three suite paths are relative to the
#     repo root, so the first `cd` moved the shell and the next two failed — `&&` short-circuited
#     and two of the three suites silently never ran, their errors scrolling past under Flutter's
#     output. Nobody noticed, because nothing else was running them either.
#   - Four pull requests merged into main on the same afternoon, each tested only on its own
#     branch. The merged result was not run until someone did it by hand afterwards.
#
# Neither needed a clever check to catch. They needed any check at all.

on:
  pull_request:
  push:
    branches: [main]

# A force-push should not leave two runs racing to report on the same pull request.
#
# Not on main, though. There, cancelling means a commit that has already landed never gets
# verified: two merges close together and the first one's run dies with the branch state it was
# checking still unexamined. On a pull request the superseded run is genuinely worthless, because
# nobody is going to merge the commit it was testing. On the default branch every commit is one
# somebody may bisect to, so each is worth the minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dart:
    name: Dart and Flutter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Each suite is its own step rather than one chained command, so a failure names the suite
      # that failed instead of a shell exit code — and so a later suite still runs when an earlier
      # one fails, which is the whole point of having three of them.
      - name: apps/spikes — harness (DER scanner, protobuf inspector, mTLS)
        working-directory: apps/spikes
        run: flutter pub get && flutter test

      - name: packages/stride_control — safety coordinator, incl. failure modes
        if: ${{ !cancelled() }}
        working-directory: packages/stride_control
        run: dart pub get && dart test

      - name: tools/glassos_mock — mock console physics and fault injection
        if: ${{ !cancelled() }}
        working-directory: tools/glassos_mock
        run: dart pub get && dart test

  android:
    name: Android unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17" # Gradle needs 17+; matches release.yml and build.gradle.kts

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This build is not the artefact — it is what creates `./gradlew` at all.
      #
      # Flutter generates the Gradle wrapper into apps/spikes/android/ during an Android build,
      # and Flutter's own .gitignore template excludes gradlew, gradlew.bat and
      # gradle-wrapper.jar because they are generated rather than authored. A fresh checkout has
      # only gradle-wrapper.properties, so running the lint step first fails with "no such file
      # or directory" and reads like a broken repo. The same build writes local.properties.
      - name: Generate the Gradle wrapper (flutter injects it) and local.properties
        working-directory: apps/spikes
        run: flutter build apk --debug

      - name: Unit tests
        working-directory: apps/spikes/android
        run: ./gradlew :app:testDebugUnitTest

      # Separate from the tests, and not skipped when they fail, because the two catch different
      # things: `NewApi`/`InlinedApi` are build-aborting errors on purpose, and neither
      # `flutter build` nor any test will catch what they catch. This project targets API 26–28
      # while compiling against a modern SDK, so a newer method overload is invisible until the
      # console throws at runtime — which has already happened once, taking out the overlay.
      - name: Lint (NewApi/InlinedApi are errors on purpose)
        if: ${{ !cancelled() }}
        working-directory: apps/spikes/android
        run: ./gradlew :app:lintDebug

      # Kept regardless of outcome: a lint failure is exactly when someone wants to read the
      # report, and it is the one artefact that explains a `NewApi` hit without a local Android
      # toolchain.
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/spikes/build/app/reports/
            apps/spikes/build/app/test-results/
          if-no-files-found: ignore
          retention-days: 7
