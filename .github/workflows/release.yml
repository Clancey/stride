name: Release

# Builds a signed Stride APK and, optionally, publishes it to the public catalog so consoles can
# pick it up as an update.
#
# The keystore lives in this repo as ciphertext (keystore/stride-release.jks.enc). CI decrypts it
# with the STRIDE_KEYSTORE_PASS secret. See docs/SIGNING.md.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the public catalog (otherwise build + verify only)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  # Two releases publishing at once would race on catalog.json and on the release tag.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub Release on this repo, and pushing the regenerated CHANGELOG.md back to
      # the default branch. The catalog repo needs a separate PAT; see CATALOG_TOKEN below.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/changelog.sh diffs this tag against the previous one. The default shallow clone
          # has neither the previous tag nor the commits between them, so every release would
          # generate empty notes - and empty notes look like "nothing changed" rather than like a
          # broken checkout, which is the kind of failure that ships.
          fetch-depth: 0

      - name: Assemble the release notes
        # Before the build, deliberately: generating notes takes a second and needs nothing but git,
        # so a mistake here should not cost ten minutes of Gradle first. It also means the notes are
        # a build input rather than an afterthought - if this step cannot describe the release, the
        # release does not happen.
        id: notes
        run: |
          set -o pipefail
          VERSION_NAME="$(grep -m1 '^version:' apps/spikes/pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')"
          VERSION_CODE="$(grep -m1 '^version:' apps/spikes/pubspec.yaml | sed 's/.*+//')"

          tools/changelog.sh notes "$VERSION_NAME" > /tmp/release-notes.md
          tools/changelog.sh json > /tmp/release-notes.json

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          {
            echo "### Release notes for $VERSION_NAME (versionCode $VERSION_CODE)"
            echo
            cat /tmp/release-notes.md
            echo
            echo "<sub>Hand-written notes come from <code>docs/release-notes/$VERSION_NAME.md</code>."
            echo "Without that file these are the commit subjects since the previous tag.</sub>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unlock the release keystore
        env:
          STRIDE_KEYSTORE_PASS: ${{ secrets.STRIDE_KEYSTORE_PASS }}
        run: |
          if [ -z "$STRIDE_KEYSTORE_PASS" ]; then
            echo "::error::STRIDE_KEYSTORE_PASS is not set. Without it the build would silently"
            echo "::error::fall back to the debug key, producing an APK no console will accept."
            exit 1
          fi
          tools/keystore.sh unlock

      - name: Build release APK
        working-directory: apps/spikes
        run: flutter build apk --release

      - name: Verify it was signed with the release key
        # The single most dangerous failure here is a debug-signed APK: it installs fine, looks
        # normal, and is silently un-updatable on every console that has the real key. Assert the
        # fingerprint rather than trusting that the unlock step worked.
        #
        # Every stage below fails loudly on its own. The first version of this step piped
        # apksigner straight into grep|awk, so when apksigner could not be found the pipeline
        # still exited 0, ACTUAL came back empty, and the job reported "signed with , expected
        # <key>" - which reads like a signing failure and is in fact a lookup failure. Never
        # compare a value that a masked pipeline failure can leave empty.
        run: |
          set -o pipefail
          EXPECTED=92534d3c0cf814e027b8338ea4cfda0f54adc5d5eff34d33463526f572887e59
          APK=apps/spikes/build/app/outputs/flutter-apk/app-release.apk

          if [ ! -f "$APK" ]; then
            echo "::error::no APK at $APK - the build step did not produce what this expects"
            find apps/spikes/build -name '*.apk' 2>/dev/null || true
            exit 1
          fi

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK (ANDROID_HOME='${ANDROID_HOME:-unset}',"
            echo "::error::ANDROID_SDK_ROOT='${ANDROID_SDK_ROOT:-unset}'). Cannot prove which key"
            echo "::error::signed this APK, so it must not be published."
            exit 1
          fi
          echo "apksigner: $APKSIGNER"

          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          # Two output formats in the wild: build-tools <=36 prints "Signer #1 certificate SHA-256
          # digest: x", 37 prints "V2 Signer: certificate SHA-256 digest: x" (and one line per
          # signature scheme). Match the part both share, then collapse to distinct values - if an
          # APK ever carried two different certs, that is exactly the thing worth stopping for.
          DIGESTS="$(printf '%s\n' "$CERTS" \
            | awk '/certificate SHA-256 digest/ {print $NF}' | sort -u)"
          COUNT="$(printf '%s\n' "$DIGESTS" | grep -c . || true)"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::could not read a signer digest out of apksigner. Full output:"
            printf '%s\n' "$CERTS"
            exit 1
          fi
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::apksigner reports $COUNT different signer certificates. Full output:"
            printf '%s\n' "$CERTS"
            exit 1
          fi
          ACTUAL="$DIGESTS"

          echo "signer: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::signed with $ACTUAL, expected the Stride release key $EXPECTED"
            exit 1
          fi

      - name: Always re-lock
        if: always()
        # The runner is ephemeral, but a workspace that is cached, uploaded, or inspected mid-run
        # should never contain the decrypted key.
        #
        # Immediately after the build, rather than as the final step: the key is needed only by
        # `flutter build apk`, and publishing, release notes and the changelog all run afterwards.
        # `always()` still fires it when the build or the signature check fails.
        run: rm -f keystore/stride-release.jks apps/spikes/android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: stride-release-apk
          path: apps/spikes/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to the catalog
        if: github.event_name == 'push' || inputs.publish
        env:
          # A PAT with `contents: write` on Clancey/stride-catalog. The default GITHUB_TOKEN is
          # scoped to THIS repo only and cannot create a release on the catalog repo.
          GH_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          VERSION_NAME: ${{ steps.notes.outputs.version_name }}
        run: |
          set -o pipefail
          APK="$GITHUB_WORKSPACE/apps/spikes/build/app/outputs/flutter-apk/app-release.apk"
          VC="$(grep -m1 '^version:' apps/spikes/pubspec.yaml | sed 's/.*+//')"

          # Read the catalog before asking for a token. It is a public repo, so the clone needs no
          # auth - only the push does - and a build whose versionCode is already published has
          # nothing to do whether or not a token exists. Checking in this order is what makes a
          # re-run of a tag, or a tag for a release that was published by hand, come back green
          # instead of failing for work that is already done.
          git clone --depth 1 https://github.com/Clancey/stride-catalog.git /tmp/catalog
          cd /tmp/catalog

          # publish.sh reuses an existing release tag and deliberately never overwrites bytes a
          # console may already have read - but it would then record the sha256 of THIS rebuild
          # against those older published bytes, and a rebuild is not byte-identical. A changed
          # build is a new versionCode; that is the rule, so honour it here.
          # One line on purpose: python3 -c with an indented block is an IndentationError.
          PUBLISHED="$(python3 -c "import json,sys; a=[x for x in json.load(open('catalog.json'))['apps'] if x.get('role')=='stride']; print(a[0]['versionCode'] if a else 0)")"
          if [ "$PUBLISHED" -ge "$VC" ]; then
            echo "catalog already publishes versionCode $PUBLISHED (this build is $VC) - nothing to do."
            {
              echo "### Already published"
              echo
              echo "The catalog serves versionCode \`$PUBLISHED\`; this build is \`$VC\`. Nothing to do."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$GH_TOKEN" ]; then
            {
              echo "### Not published"
              echo
              echo "\`CATALOG_TOKEN\` is not set, so this build never reached the catalog and no"
              echo "console will be offered it. The APK is attached to this run as an artifact."
              echo
              echo "To fix it permanently, create a fine-grained PAT with **contents: write** on"
              echo "\`Clancey/stride-catalog\` and add it as the \`CATALOG_TOKEN\` secret on this repo."
              echo
              echo "To publish this build by hand in the meantime:"
              echo
              echo '```bash'
              echo "gh run download $GITHUB_RUN_ID -n stride-release-apk -D /tmp/stride"
              echo "cd /path/to/stride-catalog"
              echo "tools/publish.sh /tmp/stride/app-release.apk --role stride --name Stride"
              echo "tools/verify.sh && git add -A && git commit -m 'Publish Stride' && git push"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CATALOG_TOKEN is not set - cannot publish to Clancey/stride-catalog."
            echo "::error::See this run's summary for how to set it, and how to publish by hand."
            exit 1
          fi

          git remote set-url origin \
            https://x-access-token:"$GH_TOKEN"@github.com/Clancey/stride-catalog.git

          ./tools/publish.sh "$APK" --role stride --name Stride

          # Put the notes *in* the catalog, not just behind releaseNotesUrl. A console has no
          # browser, so a link is a dead end; the update dialog can only tell a rider what they are
          # getting if the text travels with the entry. A window of recent versions rides along
          # because consoles skip releases - see tools/changelog.sh.
          #
          # Done here rather than inside publish.sh because publish.sh is the catalog's generic
          # publisher, shared with third-party apps whose notes we do not write.
          NOTES_JSON=/tmp/release-notes.json python3 - <<'PY'
          import json, os

          notes = json.load(open(os.environ['NOTES_JSON']))
          catalog = json.load(open('catalog.json'))

          stride = [a for a in catalog['apps'] if a.get('role') == 'stride']
          if not stride:
              raise SystemExit('no role=stride entry in catalog.json after publishing one')

          entry = stride[0]
          # Never advertise notes for a build the catalog does not serve: a console would be told
          # about changes it cannot install yet.
          served = entry['versionCode']
          entry['releaseNotes'] = [n for n in notes if n['versionCode'] <= served]

          # Same shape publish.sh writes, so the commit diff is the notes and nothing else.
          with open('catalog.json', 'w') as handle:
              json.dump(catalog, handle, indent=2)
              handle.write('\n')
          print(f"recorded notes for {len(entry['releaseNotes'])} versions up to {served}")
          PY

          ./tools/verify.sh

          # publish.sh gives a new release a placeholder body ("Published by tools/publish.sh"),
          # because it cannot know what changed. We do, and releaseNotesUrl points here - so make
          # the page worth the link for anyone who does reach it from a phone or a laptop.
          # Before the commit, since the commit below may exit early when there is nothing staged.
          gh release edit "stride-$VC" --repo Clancey/stride-catalog \
            --title "Stride $VERSION_NAME ($VC)" \
            --notes-file /tmp/release-notes.md \
            || echo "note: could not update the body of stride-$VC; the APK and catalog are fine."

          git config user.name "stride-release-bot"
          git config user.email "noreply@github.com"
          git add catalog.json
          git commit -m "Publish Stride $VERSION_NAME from ${GITHUB_SHA:0:7}" || { echo "nothing to commit"; exit 0; }
          git push
          echo "### Published versionCode $VC to the catalog" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release notes on this repo
        # Only for a real tag: a workflow_dispatch build is not a release and must not create one.
        # This is what v1.0.8 and v1.0.11 never got - both were tagged and published to the catalog,
        # and neither produced a release page, because writing one was a manual step nobody owned.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.notes.outputs.version_name }}
        run: |
          set -o pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Stride $VERSION_NAME" --notes-file /tmp/release-notes.md
            echo "updated the notes on $TAG"
          else
            gh release create "$TAG" --title "Stride $VERSION_NAME" --notes-file /tmp/release-notes.md
            echo "created $TAG"
          fi

      - name: Record the release in CHANGELOG.md
        # The changelog is generated from tags, so it can only be written after the tag exists -
        # which means committing to the default branch from a build of a commit already on it.
        #
        # In a fresh clone, not the build workspace: this workspace currently holds the DECRYPTED
        # release keystore, and no step that runs `git commit` should ever be one `git add -A` away
        # from publishing it. The clone also has no build output and no chance of a dirty tree
        # blocking the checkout.
        #
        # Non-fatal on purpose: the release is already published by this point, and a changelog that
        # missed its push is a paragraph to re-run, not a reason to show a red release. Hence
        # continue-on-error - even a failed clone must not undo a green release.
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.notes.outputs.version_name }}
        run: |
          BRANCH="${{ github.event.repository.default_branch }}"
          git clone --quiet --branch "$BRANCH" \
            "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" /tmp/changelog
          cd /tmp/changelog

          git config user.name "stride-release-bot"
          git config user.email "noreply@github.com"

          tools/changelog.sh regenerate
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already records $VERSION_NAME."
            exit 0
          fi

          git add CHANGELOG.md
          git commit --quiet -m "Record $VERSION_NAME in the changelog"
          if git push --quiet origin "$BRANCH"; then
            echo "### CHANGELOG.md updated for $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### CHANGELOG.md was not updated"
              echo
              echo "The push to \`$BRANCH\` was rejected - most likely something else landed while"
              echo "this ran. The release itself is published. To fix it:"
              echo
              echo '```bash'
              echo "git pull && tools/changelog.sh regenerate"
              echo "git commit -am 'Record $VERSION_NAME in the changelog' && git push"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::could not push CHANGELOG.md; see the run summary."
          fi

